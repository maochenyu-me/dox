name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    env:
      ZIG_VERSION: "latest"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: apps/server/go.sum

      - name: Setup Zig for ARM64 cross-compilation
        if: matrix.goarch == 'arm64'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build dox-server
        working-directory: apps/server
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p bin

          # mattn/go-sqlite3 requires cgo. Static linking keeps the artifact
          # portable across linux distros (alpine release image, scratch, etc).
          # amd64 uses the runner's gcc; arm64 cross-compiles via zig cc.
          if [ "${GOARCH}" = "arm64" ]; then
            export CC="zig cc -target aarch64-linux-musl"
            export CXX="zig c++ -target aarch64-linux-musl"
          else
            export CC="gcc"
          fi

          go build -trimpath -tags netgo \
            -ldflags="-s -w -linkmode external -extldflags '-static' \
              -X github.com/lin-snow/dox/apps/server/internal/version.version=${VERSION} \
              -X github.com/lin-snow/dox/apps/server/internal/version.commit=${COMMIT} \
              -X github.com/lin-snow/dox/apps/server/internal/version.date=${BUILD_DATE} \
              -X github.com/lin-snow/dox/apps/server/internal/version.builtBy=github-actions" \
            -o bin/dox-server-${GOOS}-${GOARCH} \
            ./cmd/dox-server

      - uses: actions/upload-artifact@v7
        with:
          name: dox-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apps/server/bin/dox-server-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: apps/server/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto and install dependencies
        shell: pwsh
        run: |
          buf generate
          bun install --frozen-lockfile

      - name: Build Windows ZIP
        shell: pwsh
        env:
          SERVER_VERSION: ${{ github.ref_name }}
        run: ./scripts/build-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: dox-windows-amd64
          path: dist/dox-windows-amd64.zip
          if-no-files-found: error

      # Standalone exes for users who just want the two binaries without the
      # zip wrapper; published as individual release assets.
      - uses: actions/upload-artifact@v7
        with:
          name: dox-windows-exe
          path: |
            dist/windows-amd64/dox.exe
            dist/windows-amd64/dox-server.exe
          if-no-files-found: error

  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: dox-windows-exe
          path: ./artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./artifacts/dox.exe
            ./artifacts/dox-server.exe
          draft: true
          prerelease: false
          generate_release_notes: true

